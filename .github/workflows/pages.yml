name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Point the page at the API (repository variable TICO_API_URL)
        env:
          TICO_API_URL: ${{ vars.TICO_API_URL }}
        run: |
          if [ -z "$TICO_API_URL" ]; then
            echo "::error::Set the repository variable TICO_API_URL (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
          case "$TICO_API_URL" in https://*) ;; *) echo "::error::TICO_API_URL must start with https://"; exit 1 ;; esac
          url="${TICO_API_URL%/}"
          printf "// Written by .github/workflows/pages.yml from the repository variable TICO_API_URL.\nwindow.TICO_API = '%s';\n" "$url" > site/config.js
          cat site/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
